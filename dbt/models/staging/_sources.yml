version: 2

# Raw layer files written by Python (ptf.trade.baci.write_landing,
# ptf.trade.reference.write_reference_tables). PTF_RAW_DIR is set by ptf.core.warehouse.run_dbt.
sources:
  - name: baci
    description: CEPII BACI V202601 (HS 2017), polyethylene flows and code lists, unpacked from the zip.
    meta:
      external_location: "read_parquet('{{ env_var('PTF_RAW_DIR', '../data/raw') }}/baci/{name}.parquet')"
    tables:
      - name: landing_hs3901
        description: One row per year, exporter, importer and HS6 product; values as published.
      - name: landing_country_codes
        description: BACI's country list (numeric code, name, ISO2, ISO3).
      - name: landing_product_codes
        description: HS6 codes of the product group with BACI's descriptions.
      - name: landing_all_trade
        description: >
          World trade of all products per year and code (HS4 heading; HS6 for the product
          group 3901), summed while unpacking (spec 008). value_kusd in thousand USD.

  - name: reference
    description: Reference tables generated from config/regions.yaml.
    meta:
      external_location: "read_parquet('{{ env_var('PTF_RAW_DIR', '../data/raw') }}/reference/{name}.parquet')"
    tables:
      - name: regions
      - name: country_region
      - name: country_aliases
      - name: market_series
        description: Metadata of the market series (config/markets.yaml, plus GSCPI).
      - name: ports
        description: Ports configured for the monitor (config/shipping.yaml).

  # IMF PortWatch: one Parquet file per download and folder; dbt reads all downloads of a
  # folder at once and keeps the most recent value in staging.
  - name: portwatch
    description: IMF PortWatch downloads (ptf.shipping.portwatch), files never overwritten.
    tables:
      - name: chokepoints_daily
        meta:
          external_location: "read_parquet('{{ env_var('PTF_RAW_DIR', '../data/raw') }}/portwatch/chokepoints_daily/*.parquet', union_by_name = true)"
      - name: ports_daily
        meta:
          external_location: "read_parquet('{{ env_var('PTF_RAW_DIR', '../data/raw') }}/portwatch/ports_daily/*.parquet', union_by_name = true)"
      - name: events
        meta:
          external_location: "read_parquet('{{ env_var('PTF_RAW_DIR', '../data/raw') }}/portwatch/events/*.parquet', union_by_name = true)"
      - name: port_links
        meta:
          external_location: "read_parquet('{{ env_var('PTF_RAW_DIR', '../data/raw') }}/portwatch/port_links/*.parquet', union_by_name = true)"
      - name: country_trade_daily
        description: Optional (download_country_trade); only read when country_trade_enabled.
        meta:
          external_location: "read_parquet('{{ env_var('PTF_RAW_DIR', '../data/raw') }}/portwatch/country_trade_daily/*.parquet', union_by_name = true)"
      - name: chokepoints
        meta:
          external_location: "read_parquet('{{ env_var('PTF_RAW_DIR', '../data/raw') }}/portwatch/chokepoints.parquet')"
      - name: ports
        meta:
          external_location: "read_parquet('{{ env_var('PTF_RAW_DIR', '../data/raw') }}/portwatch/ports.parquet')"

  - name: wits
    description: World Bank WITS (TRAINS) EU duty rates per PE grade, parsed by ptf.trade.duties.
    meta:
      external_location: "read_parquet('{{ env_var('PTF_RAW_DIR', '../data/raw') }}/wits/{name}.parquet')"
    tables:
      - name: landing_eu_duty
        description: Newest MFN rate per HS6 grade (empty before the first download).

  - name: comext
    description: Eurostat Comext DS-045409, EU27 imports per partner and PE grade, parsed by ptf.trade.comext (spec 019).
    meta:
      external_location: "read_parquet('{{ env_var('PTF_RAW_DIR', '../data/raw') }}/comext/{name}.parquet')"
    tables:
      - name: landing_eu_imports
        description: Monthly extra-EU imports (empty before the first download).

  - name: openmeteo
    description: Open-Meteo marine weather and wind downloads (ptf.shipping.weather), never overwritten.
    tables:
      - name: weather
        meta:
          external_location: "read_parquet('{{ env_var('PTF_RAW_DIR', '../data/raw') }}/weather/*.parquet', union_by_name = true)"

  - name: fred
    description: FRED series, one CSV per download in fred/{series_id}/ (ptf.markets.fred).
    tables:
      - name: series_csv
        meta:
          # Every file has a header "observation_date,<SERIES ID>"; names= gives all files the
          # same columns. FRED marks missing days with "." or an empty field. Types are cast in
          # staging: dbt-duckdb fills {name} via str.format, so no curly braces may appear here.
          external_location: >-
            read_csv('{{ env_var('PTF_RAW_DIR', '../data/raw') }}/fred/*/*.csv',
            filename = true, header = true, names = ['observation_date', 'value'],
            nullstr = ['.', ''], all_varchar = true)

  - name: dce
    description: >
      Dalian Commodity Exchange LLDPE main contract via AKShare (Sina Finance), newest value
      per day, written by ptf.markets.dce.write_dce_landing (empty without the asia extra).
    tables:
      - name: landing_dce
        meta:
          external_location: "read_parquet('{{ env_var('PTF_RAW_DIR', '../data/raw') }}/dce/landing_dce.parquet')"
      - name: landing_dce_quote
        description: Newest intraday quote of the main contract (spec 012), empty before the first.
        meta:
          external_location: "read_parquet('{{ env_var('PTF_RAW_DIR', '../data/raw') }}/dce/landing_dce_quote.parquet')"

  - name: eurostat
    description: Eurostat monthly price indices (spec 019), parsed by ptf.markets.eurostat.
    meta:
      external_location: "read_parquet('{{ env_var('PTF_RAW_DIR', '../data/raw') }}/eurostat/{name}.parquet')"
    tables:
      - name: landing_eurostat
        description: date, series_id, value (empty before the first download).

  - name: gscpi
    description: NY Fed GSCPI, parsed from the .xls by ptf.markets.gscpi.write_gscpi_landing.
    tables:
      - name: landing_gscpi
        meta:
          external_location: "read_parquet('{{ env_var('PTF_RAW_DIR', '../data/raw') }}/gscpi/landing_gscpi.parquet')"
