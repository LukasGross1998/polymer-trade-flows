version: 2

models:
  - name: dim_region
    description: Model regions (config/regions.yaml) plus rest of world.
    columns:
      - name: region
        description: Region code, e.g. EUR, MDE, ROW.
        data_tests: [unique, not_null]
      - name: region_name
      - name: port
        description: Representative seaport for sea distances; empty for ROW.
      - name: port_lon
      - name: port_lat

  - name: dim_country
    description: One row per country (ISO3) with its model region; unlisted countries -> ROW.
    columns:
      - name: iso3
        description: ISO 3166-1 alpha-3; "S19" (Other Asia, nes) is mapped to TWN.
        data_tests: [unique, not_null]
      - name: country_name
      - name: region
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_region')
                field: region
      - name: is_reporter
        description: Queried from Comtrade in phase 1 (only relevant for the Comtrade check).

  - name: dim_product
    description: Polyethylene HS6 products (HS 2017).
    columns:
      - name: hs6
        data_tests: [unique, not_null]
      - name: product
        description: Short name (seed product_short_names), BACI description as fallback.
      - name: description
        description: BACI's official description.

  - name: fct_trade
    description: >
      One row per year, exporter, importer and HS6 product (CEPII BACI, values FOB).
      Missing quantities are imputed as value / median unit value of the same product
      and year and flagged.
    data_tests:
      - unique_combination:
          arguments:
            columns: [year, exporter_iso3, importer_iso3, hs6]
    columns:
      - name: year
        data_tests: [not_null]
      - name: exporter_iso3
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_country')
                field: iso3
      - name: importer_iso3
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_country')
                field: iso3
      - name: hs6
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: hs6
      - name: value_usd
        description: Trade value, FOB, current USD.
        data_tests: [not_null, non_negative]
      - name: qty_t
        description: Quantity in tonnes; imputed where BACI has none.
        data_tests: [non_negative]
      - name: is_imputed
        description: True if qty_t was imputed by us.

  - name: mart_bilateral_trade
    description: fct_trade summed over the products per year, exporter and importer.
    data_tests:
      - unique_combination:
          arguments:
            columns: [year, exporter_iso3, importer_iso3]
    columns:
      - name: year
      - name: exporter_iso3
      - name: importer_iso3
      - name: exporter_region
        data_tests: [not_null]
      - name: importer_region
        data_tests: [not_null]
      - name: value_usd
      - name: qty_t
        data_tests: [non_negative]
      - name: imputed_qty_t
        description: Part of qty_t that was imputed.

  - name: mart_region_trade
    description: Trade per year and region pair, including trade within a region. Input of the transport LP.
    data_tests:
      - unique_combination:
          arguments:
            columns: [year, exporter_region, importer_region]
    columns:
      - name: year
      - name: exporter_region
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_region')
                field: region
      - name: importer_region
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_region')
                field: region
      - name: value_usd
      - name: qty_t
        data_tests: [non_negative]
      - name: imputed_qty_t

  - name: mart_import_sources
    description: >
      Imports per year, importer region and exporter country, with the share in the
      importer region's extra-regional imports (spec 006). Input of the Sourcing tab.
    data_tests:
      - unique_combination:
          arguments:
            columns: [year, importer_region, exporter_iso3]
    columns:
      - name: year
      - name: importer_region
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_region')
                field: region
      - name: exporter_iso3
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_country')
                field: iso3
      - name: exporter_name
        description: Country name (dim_country).
      - name: exporter_region
        data_tests: [not_null]
      - name: is_intra_regional
        description: True if exporter and importer are in the same model region.
      - name: qty_t
        description: Tonnes, summed over the polyethylene products.
        data_tests: [non_negative]
      - name: value_usd
        description: Trade value, FOB, current USD.
      - name: share_extra
        description: >
          Share of qty_t in the importer region's imports from outside the region (0-1);
          empty for trade within the region.
        data_tests:
          - value_between:
              arguments:
                min_value: 0
                max_value: 1

  - name: mart_trade_by_class
    description: >
      World trade (all transport modes) per year and commodity class (spec 008): value,
      tonnes and shares in the year's total. Leaf classes only; `parent` links to the
      hierarchy in the seed commodity_class_tree.
    data_tests:
      - unique_combination:
          arguments:
            columns: [year, class]
    columns:
      - name: year
      - name: class
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('commodity_class_tree')
                field: class
      - name: parent
        description: Parent class, e.g. "Polyethylene" for HDPE, "All goods" for top classes.
      - name: sort_order
        description: Display order within the parent.
      - name: value_usd
        description: Trade value, FOB, current USD.
        data_tests: [non_negative]
      - name: qty_t
        description: Tonnes (flows without a quantity count 0).
        data_tests: [non_negative]
      - name: value_usd_without_qty
        description: Part of value_usd from flows without a quantity in BACI.
      - name: value_share
        description: Share in the year's world trade value (0-1).
        data_tests:
          - value_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: qty_share
        description: Share in the year's world trade tonnes (0-1).
        data_tests:
          - value_between:
              arguments:
                min_value: 0
                max_value: 1

  - name: mart_import_sources_by_product
    description: >
      Imports per year, importer region, exporter country and HS6 grade (spec 008); the
      Sourcing and Landed cost tabs filter it by grade.
    data_tests:
      - unique_combination:
          arguments:
            columns: [year, importer_region, exporter_iso3, hs6]
    columns:
      - name: year
      - name: importer_region
        data_tests: [not_null]
      - name: exporter_iso3
        data_tests: [not_null]
      - name: exporter_name
      - name: exporter_region
        data_tests: [not_null]
      - name: hs6
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: hs6
      - name: is_intra_regional
      - name: qty_t
        data_tests: [non_negative]
      - name: value_usd

  - name: mart_eu_duty
    description: EU third-country (MFN) import duty per PE grade from WITS (spec 009).
    columns:
      - name: hs6
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: hs6
      - name: year
        description: Newest year WITS has a rate for (tariff schedules change rarely).
      - name: mfn_pct
        description: Highest MFN rate of the grade's tariff lines, % of the customs value.
        data_tests:
          - value_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: avg_pct
        description: Simple average over the tariff lines (WITS OBS_VALUE).
      - name: min_pct
      - name: tariff_lines
        description: Number of national tariff lines (8-digit CN codes) behind the HS6 grade.
      - name: source
