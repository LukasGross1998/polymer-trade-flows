version: 2

models:
  - name: dim_market_series
    description: Market series from config/markets.yaml plus the NY Fed GSCPI.
    columns:
      - name: series_id
        description: FRED id (e.g. DCOILBRENTEU) or GSCPI.
        data_tests: [unique, not_null]
      - name: name
      - name: unit
      - name: frequency
        data_tests:
          - accepted_values:
              arguments:
                values: [daily, monthly]
      - name: group
        quote: true  # "group" is an SQL keyword
        data_tests:
          - accepted_values:
              arguments:
                values: [energy, gas, freight_polymers, fx, supply_chain, china_futures, rates, eu_prices]

  - name: fct_market_prices
    description: One observation per date and series (newest download of each FRED series).
    data_tests:
      - unique_combination:
          arguments:
            columns: [date, series_id]
    columns:
      - name: date
        data_tests: [not_null]
      - name: series_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_market_series')
                field: series_id
      - name: value
        data_tests: [not_null]

  - name: mart_market_series
    description: fct_market_prices with the series metadata, as read by the app.
    columns:
      - name: date
      - name: series_id
      - name: name
      - name: unit
      - name: frequency
      - name: group
      - name: value

  - name: mart_brent_annual
    description: Annual average Brent price (USD/bbl) and the number of quoted days.
    columns:
      - name: year
        data_tests: [unique, not_null]
      - name: brent_usd_per_bbl
      - name: quoted_days

  - name: mart_dce_quote
    description: >
      Latest intraday quote of the Dalian LLDPE main contract via AKShare (spec 012); at most
      one row, empty without the asia extra. Unofficial source (ADR-015).
    columns:
      - name: symbol
        description: Contract code, L0 = main contract (continuous).
      - name: last_cny_t
        description: Last trade, CNY per tonne (China, incl. VAT).
        data_tests: [non_negative]
      - name: bid_cny_t
        description: Best bid.
      - name: ask_cny_t
        description: Best ask.
      - name: prev_settle_cny_t
        description: Settlement price of the previous trading day.
      - name: tick_time_beijing
        description: Time of the last trade as reported by Sina (Beijing time, HH:MM:SS).
      - name: trading_day
        description: Exchange trading day (a night session counts for the next day).
      - name: fetched_at
        description: Time of our download (UTC); Sina's delay is not documented.
