# Parameters of the shipping monitor (IMF PortWatch). Rationale: docs/methodology.md, section 4.

# Years whose average defines "normal" traffic for each calendar week: before the Red Sea
# crisis (attacks from late 2023 on) and including the 2019-2023 Covid swings.
baseline_years: [2019, 2020, 2021, 2022, 2023]

rolling_window_days: 7

# A chokepoint counts as disrupted when its 7-day average falls below this share of normal.
disruption_threshold: 0.70

# Below this normal traffic (vessels per day) a chokepoint is not flagged: at 0.1 ships a day,
# a single quiet week would otherwise read as "-100 %, disrupted".
min_baseline_per_day: 2.0

# Chokepoints of the Red Sea diversion ratio (PortWatch ids).
red_sea:
  red_sea_route: chokepoint4   # Bab el-Mandeb Strait
  cape_route: chokepoint7      # Cape of Good Hope

# PortWatch revises recent days after publication. Each update re-fetches this many days
# before the last stored date; the clean step keeps the most recently fetched value per day.
revision_days: 14

# Ports shown in the ports tab (PortWatch ids). Chosen for polyethylene trade: export hubs
# of the cheap producers, the main European import hubs and the large Asian import ports.
# `region` (config/regions.yaml) links a port to the order planner's lead times (spec 010).
ports:
  - {id: port481, name: Houston, role: US Gulf Coast export hub, region: NAM}
  - {id: port1160, name: Santos, role: South American import port, region: SAM}
  - {id: port57, name: Antwerp, role: European polymer hub, region: EUR}
  - {id: port1114, name: Rotterdam, role: European import hub, region: EUR}
  - {id: port24, name: Jubail, role: Saudi petrochemical port inside the Gulf, region: MDE}
  - {id: port570, name: Yanbu, role: Saudi Red Sea port outside Hormuz, region: MDE}
  - {id: port744, name: Jebel Ali, role: UAE hub inside the Gulf, region: MDE}
  - {id: port1188, name: Shanghai, role: Chinese import port, region: CHN}
  - {id: port824, name: Ningbo, role: Chinese import port, region: CHN}
  - {id: port1201, name: Singapore, role: Southeast Asian hub, region: SEA}
  - {id: port1065, name: Busan, role: Korean export port, region: NEA}

# Port-to-port network (PortWatch snapshot): only links with at least this daily vessel
# capacity are downloaded. 1,000 keeps ~8,100 of 227,000 links and ~71 % of total capacity.
min_link_capacity: 1000

# Country trade by cargo type (PortWatch Daily_Trade_Data_REG, ~560,000 rows). The first
# download takes 20-25 minutes (2-3.5 s per page of 1,000 rows), later updates only a few
# pages. Switched off until it is needed; set to true and run `pipeline portwatch`.
download_country_trade: false

# Marine weather at the chokepoints and ports (Open-Meteo, no key; spec 009).
# Storm warnings: amber from `amber`, red from `red` (inclusive), whichever variable is worse.
# source: Beaufort scale (gale = force 8 from 62 km/h, storm = force 10 from 89 km/h); wave
# heights: assumption (about "rough" and "very high" seas in the Douglas sea scale).
weather:
  past_days: 7
  forecast_days: 7
  waves_m: {amber: 4.0, red: 6.0}
  gusts_kmh: {amber: 62.0, red: 89.0}
