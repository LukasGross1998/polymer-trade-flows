# Parameters of the data pipeline (phase 1). Rationale: docs/methodology.md.

# Trade data source (ADR-009): CEPII BACI, reconciled bilateral trade for ~200 countries.
baci:
  version: "202601"        # released January 2026, data up to 2024
  hs_revision: HS17        # HS 2017 nomenclature, years 2017-2024 in this version
  url: https://www.cepii.fr/DATA_DOWNLOAD/baci/data/BACI_{hs_revision}_V{version}.zip
  hs_prefix: "3901"        # polyethylene in primary forms: 390110, 390120, 390130, 390140, 390190
  years: [2019, 2020, 2021, 2022, 2023, 2024]

# Superseded by BACI (ADR-009). Kept for the comparison in the data-quality report;
# run only on request with `pipeline comtrade`.
comtrade:
  hs_code: "3901"          # polyethylene in primary forms (incl. EVA 390130, see SPEC 1)
  years: [2019, 2020, 2021, 2022, 2023, 2024]
  # The public endpoint throttles to roughly one request per second (HTTP 429 otherwise).
  request_pause_seconds: 1.5
  max_retries: 5

brent:
  fred_series: DCOILBRENTEU  # Brent, Europe, daily spot price in USD/bbl

cleaning:
  # Unit-value outliers: |log(unit value) - median| > threshold * robust standard deviation
  # (MAD scaled by 1.4826), computed per year and flow.
  outlier_mad_threshold: 3.0
