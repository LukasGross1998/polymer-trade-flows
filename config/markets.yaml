# Market data for the dashboard. All sources are free and need no key.
# Rationale and caveats: docs/methodology.md, section 5.

# FRED (St. Louis Fed) series, downloaded as CSV from fredgraph.csv.
# A series is downloaded again when its newest raw file is older than `max_age_days`.
max_age_days: 1

fred_series:
  - id: DCOILBRENTEU
    name: Brent crude oil
    unit: USD/bbl
    frequency: daily
    group: energy
  - id: DCOILWTICO
    name: WTI crude oil
    unit: USD/bbl
    frequency: daily
    group: energy
  - id: DHHNGSP
    name: Natural gas, US (Henry Hub)
    unit: USD/MMBtu
    frequency: daily
    group: gas
  - id: PNGASEUUSDM
    name: Natural gas, Europe
    unit: USD/MMBtu
    frequency: monthly
    group: gas
  - id: PNGASJPUSDM
    name: LNG, Japan
    unit: USD/MMBtu
    frequency: monthly
    group: gas
  - id: PCU483111483111
    name: US PPI deep sea freight (proxy for ocean freight rates)
    unit: index
    frequency: monthly
    group: freight_polymers
  - id: PCU3252113252111
    name: US PPI thermoplastic resins (proxy for polymer prices)
    unit: index
    frequency: monthly
    group: freight_polymers
  - id: PCU325211325211
    name: US PPI plastics material and resin manufacturing
    unit: index
    frequency: monthly
    group: freight_polymers
  - id: DEXUSEU
    name: US dollars per euro
    unit: USD/EUR
    frequency: daily
    group: fx
  - id: DEXCHUS
    name: Chinese yuan per US dollar
    unit: CNY/USD
    frequency: daily
    group: fx
  - id: DTWEXBGS
    name: US dollar index (broad)
    unit: index
    frequency: daily
    group: fx
  - id: IR3TIB01EZM156N        # OECD via FRED; capital tied up in transit (spec 016)
    name: Euro area 3-month interbank rate
    unit: "%"
    frequency: monthly
    group: rates

# Daily LLDPE price from the Dalian Commodity Exchange (spec 011, ADR-015): main contract
# via Sina Finance through AKShare – unofficial, "for academic research" by AKShare's own
# statement. Downloaded only when the optional extra is installed: `uv sync --extra asia`.
# Prices in China in CNY per tonne, including 13 % VAT; not comparable 1:1 with export prices.
dce:
  series_id: DCE_LLDPE
  symbol: L0                  # LLDPE ("plastic", DCE code L), main contract, continuous
  name: LLDPE futures, Dalian (main contract)
  unit: CNY/t
  start_date: "2019-01-01"

# New York Fed Global Supply Chain Pressure Index (monthly, standard deviations from the
# historical average). The file is an old-format .xls despite its .xlsx extension.
gscpi_url: https://www.newyorkfed.org/medialibrary/research/interactives/gscpi/downloads/gscpi_data.xlsx

# Key events, drawn as vertical markers in time-series charts.
key_events:
  - date: 2023-11-19
    label: Red Sea attacks
    source: public reporting (seizure of the Galaxy Leader)
  - date: 2026-03-01
    label: Hormuz disruption
    source: IMF PortWatch disruption event HORMUZ-26
