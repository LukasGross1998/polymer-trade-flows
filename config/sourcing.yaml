# Buyer view of the dashboard (ptf.insights, spec 006). Rationale: docs/methodology.md,
# section 6. All thresholds are assumptions (source: assumption) to be tuned by the user.

# The buyer's region: imports into this model region (config/regions.yaml) are analysed.
focus_region: EUR

# searoute passage name -> PortWatch chokepoint id (marts.dim_chokepoint). The order is the
# order in route labels: roughly from Asia westwards, so a Gulf route reads
# "Hormuz · Bab el-Mandeb · Suez · Gibraltar".
# source: searoute's passage list and IMF PortWatch chokepoint names.
passage_chokepoints:
  ormuz: chokepoint6         # Strait of Hormuz
  malacca: chokepoint5       # Malacca Strait
  sunda: chokepoint19        # Sunda Strait
  babalmandab: chokepoint4   # Bab el-Mandeb Strait
  suez: chokepoint1          # Suez Canal
  south_africa: chokepoint7  # Cape of Good Hope
  bosporus: chokepoint3      # Bosporus Strait
  gibraltar: chokepoint8     # Gibraltar Strait
  panama: chokepoint2        # Panama Canal
  bering: chokepoint26       # Bering Strait

# Traffic lights on the situation page: amber from `amber`, red from `red` (inclusive).
# source: assumption
signals:
  price:
    series: DCOILBRENTEU     # Brent, converted to EUR with DEXUSEU
    days: 90                 # change over this many days, in %
    amber: 5.0
    red: 10.0
  supply:                    # share of extra-regional imports through a disrupted chokepoint, %
    amber: 10.0
    red: 25.0
  logistics:                 # latest GSCPI, standard deviations from the average
    series: GSCPI
    amber: 0.5
    red: 1.0

# "What changed" list on the situation page.
recent_days: 7

# Landed cost per supplier country (spec 007): price (BACI unit value) + sea freight
# (config/model.yaml) + EU duty on price + freight, converted to EUR.
landed_cost:
  top_n: 10                    # largest supplier countries by volume shown in the chart
  fx_series: DEXUSEU           # US dollars per euro
  resin_index: PCU325211325211 # scales the BACI-year unit value to today ("indexed" basis)
  duty:
    # source for all rates: EU TARIC as mirrored by tariffnumber.com (CN 3901 10 10,
    # 3901 20 90), read 2026-11-13. Not yet checked in the official TARIC consultation.
    default_pct: 6.5           # third-country duty (erga omnes)
    preferential:
      USA:
        pct: 0.0
        source: "TARIC mirror: tariff preference from 2026-07-01"
      KOR:
        pct: 0.0
        source: "TARIC mirror: EU-Korea FTA, from 2014-07-01"
      EGY:
        pct: 0.0
        source: "TARIC mirror: EU-Egypt Association Agreement, from 2004-06-01"
      ISR:
        pct: 0.0
        source: "TARIC mirror: EU-Israel Association Agreement"
      BRA: &mercosur
        pct: 5.2
        source: "TARIC mirror: Mercosur group, 2026-05-01 to 2026-12-31 (phase-in)"
      ARG: *mercosur
      URY: *mercosur
      PRY: *mercosur
