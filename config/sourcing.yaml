# Buyer view of the dashboard (ptf.insights, spec 006). Rationale: docs/methodology.md,
# section 6. Spec 015: facts carry source, url and read date; thresholds and limits are
# settings (the user's choice). Value register: docs/value_register.md.

# The buyer's region: imports into this model region (config/regions.yaml) are analysed.
focus_region: EUR

# searoute passage name -> PortWatch chokepoint id (marts.dim_chokepoint). The order is the
# order in route labels: roughly from Asia westwards, so a Gulf route reads
# "Hormuz · Bab el-Mandeb · Suez · Gibraltar".
# source: searoute's passage list and IMF PortWatch chokepoint names.
passage_chokepoints:
  ormuz: chokepoint6         # Strait of Hormuz
  malacca: chokepoint5       # Malacca Strait
  sunda: chokepoint19        # Sunda Strait
  babalmandab: chokepoint4   # Bab el-Mandeb Strait
  suez: chokepoint1          # Suez Canal
  south_africa: chokepoint7  # Cape of Good Hope
  bosporus: chokepoint3      # Bosporus Strait
  gibraltar: chokepoint8     # Gibraltar Strait
  panama: chokepoint2        # Panama Canal
  bering: chokepoint26       # Bering Strait

# Route scenarios (spec 014), settings. A chokepoint listed here has a sea detour: the route
# variant of config/model.yaml that avoids it (searoute confirms the detour exists). A
# chokepoint not listed (e.g. Hormuz: searoute finds no path out of the Gulf without it) has
# none: closing it puts the volume behind it at risk.
chokepoint_detours:
  chokepoint4: babalmandab_closed   # Bab el-Mandeb -> around the Cape
  chokepoint1: suez_closed          # Suez -> around the Cape
  chokepoint5: malacca_closed   # Malacca -> Sunda Strait
  chokepoint8: gibraltar_closed # Gibraltar -> around the Cape
scenarios:
  closed_below_pct: 50          # live status: closed when 7-day traffic is >= 50 % below normal
  presets:
    all_open: {label: "All routes open", closed: []}
    red_sea_closed: {label: "Red Sea closed", closed: [chokepoint4, chokepoint1]}
    hormuz_closed: {label: "Hormuz closed", closed: [chokepoint6]}

# Traffic lights on the situation page, four levels (spec 013): yellow from `yellow`, orange
# from `orange`, red from `red` (inclusive), green below. Red is meant for real exceptions.
# setting: all thresholds below are the user's choice (GSCPI in standard deviations).
signals:
  price:
    series: DCOILBRENTEU     # Brent, converted to EUR with DEXUSEU
    days: 90                 # change over this many days, in %
    yellow: 5.0
    orange: 15.0
    red: 30.0
  supply:                    # share of extra-regional imports through a disrupted chokepoint, %
    yellow: 10.0
    orange: 25.0
    red: 50.0
  logistics:                 # latest GSCPI, standard deviations from the average
    series: GSCPI
    yellow: 0.5
    orange: 1.0
    red: 2.0

# What is relevant for a buyer in the focus region (spec 013). The situation page shows only
# these by default; a switch shows everything. setting
relevance:
  min_region_share: 5.0          # supplier regions with >= 5 % of extra-regional imports
  extra_chokepoints: [chokepoint9]   # Dover Strait: approach to the ARA ports
  event_radius_km: 1000          # disruption events this close to a relevant chokepoint or port
  series:                        # market series for "what changed"
    - DCOILBRENTEU
    - DCOILWTICO
    - DHHNGSP
    - PNGASEUUSDM
    - DEXUSEU
    - PCU3252113252111
    - PCU325211325211
    - PCU483111483111
    - DCE_LLDPE

# "What changed" list on the situation page.
recent_days: 7

# Landed cost per supplier country (spec 007): price (BACI unit value) + sea freight
# (config/model.yaml, today not sourced: shown as n/a) + EU duty, converted to EUR.
landed_cost:
  top_n: 10                    # setting: largest supplier countries by volume shown
  fx_series: DEXUSEU           # US dollars per euro (FRED)
  resin_index: PCU325211325211 # US PPI plastics resins (FRED), scales the BACI-year unit value
  duty:
    # The third-country rate per grade comes from World Bank WITS (pipeline); this value is
    # the fallback when WITS has none.
    default_pct:
      value: 6.5
      source: "EU TARIC, third-country duty (erga omnes), CN 3901 10 10 90"
      url: "https://ec.europa.eu/taxation_customs/dds2/taric/measures.jsp?Lang=en&Taric=3901101090&SimDate=20261114&Area=US"
      read: 2026-11-14
    # Preferences found in TARIC for the extra-European suppliers on 14 Nov 2026 (checked:
    # USA, CAN, MEX, BRA, ARG, URY, PRY, KOR, JPN, SGP, EGY, ISR, DZA, ZAF, UZB with a
    # preference; SAU, QAT, ARE, KWT, OMN, CHN, IND, TWN, THA, MYS, IRN, RUS without one).
    # Checked on CN 3901 10 10 90; for USA also on 3901 20 90 00. Other 3901 lines may
    # differ: TARIC is the reference.
    preferential:
      USA:
        value: 0.0
        source: "EU TARIC, tariff preference for US, CN 3901 10 10 90 and 3901 20 90 00"
        url: "https://ec.europa.eu/taxation_customs/dds2/taric/measures.jsp?Lang=en&Taric=3901101090&SimDate=20261114&Area=US"
        read: 2026-11-14
        valid_from: 2026-07-01
      CAN:
