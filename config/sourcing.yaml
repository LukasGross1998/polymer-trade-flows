# Imports under EU sanctions (TARIC "import control" measures on CN 3901 10 10 90). Used by
# the sourceable filter (phase 2); listed here so the source stays with the data.
import_controls:
  IRN:
    regulation: "Council Regulation (EU) No 267/2012, import control from 2025-09-30"
    url: "https://ec.europa.eu/taxation_customs/dds2/taric/measures.jsp?Lang=en&Taric=3901101090&SimDate=20261114&Area=IR"
    read: 2026-11-14
  RUS:
    regulation: "Council Regulation (EU) No 833/2014, import control 2023-12-19 to 2027-12-31"
    url: "https://ec.europa.eu/taxation_customs/dds2/taric/measures.jsp?Lang=en&Taric=3901101090&SimDate=20261114&Area=RU"
    read: 2026-11-14

# Order planner (spec 010, revised by spec 015): ship transit time =
#   median time in port at origin + sea days + median time in port at destination.
# Sea days = searoute distance / average speed at sea of container ships. Not included
# (no source): loading and export clearance, import clearance, delivery to the warehouse,
# waiting for a sailing, congestion or storm delays (shown as flags only).
lead_time:
  vessel_size: "8000-11999"   # setting: container ship size (TEU) whose speed is used
  speed_knots:
    source: "Fourth IMO GHG Study 2020, Table 35 (detailed results for 2018), average speed over ground at sea, container ships by size (TEU)"
    url: "https://www.imo.org/en/OurWork/Environment/Pages/Fourth-IMO-Greenhouse-Gas-Study-2020.aspx"
    read: 2026-11-14
    values:
      "0-999": 11.8
      "1000-1999": 13.4
      "2000-2999": 14.2
      "3000-4999": 14.7
      "5000-7999": 15.7
      "8000-11999": 16.3
      "12000-14499": 16.3
      "14500-19999": 16.5
      "20000-+": 16.3
  port_days:
    source: "UNCTADstat US.PortCalls, median time in port (days), container ships, 2023 (bulk file of March 2024, 22 economies)"
    url: "https://unctadstat-api.unctad.org/bulkdownload/US.PortCalls/US_PortCalls"
    read: 2026-11-14
    note: "time the ship spends in port, not the cargo's loading, clearance and delivery"
    values:
      AUS: 1.4417
      CAN: 1.4569
      CHN: 0.6049
      HRV: 0.6701
      DNK: 0.5701
      FRA: 0.8535
      DEU: 1.0174
      GRC: 1.034
      IDN: 0.9653
      ITA: 0.8997
      JPN: 0.35
      KOR: 0.6465
      NLD: 0.8007
      NOR: 0.2958
      PHL: 0.825
      RUS: 1.5562
      SGP: 0.8521
      ESP: 0.6007
      SWE: 0.6674
      TUR: 0.6528
      GBR: 0.6812
      USA: 1.084
  destination_country: NLD    # setting: country of the focus region's representative port (Rotterdam)
  default_need_by_days: 45    # setting
  default_quantity_t: 500     # setting
