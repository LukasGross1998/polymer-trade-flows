# Parameters of the shipping monitor (IMF PortWatch). Rationale: docs/methodology.md, section 4.

# Years whose average defines "normal" traffic for each calendar week: before the Red Sea
# crisis (attacks from late 2023 on) and including the 2019-2023 Covid swings.
baseline_years: [2019, 2020, 2021, 2022, 2023]

rolling_window_days: 7

# A chokepoint counts as disrupted when its 7-day average falls below this share of normal.
disruption_threshold: 0.70

# Below this normal traffic (vessels per day) a chokepoint is not flagged: at 0.1 ships a day,
# a single quiet week would otherwise read as "-100 %, disrupted".
min_baseline_per_day: 2.0

# Chokepoints of the Red Sea diversion ratio (PortWatch ids).
red_sea:
  red_sea_route: chokepoint4   # Bab el-Mandeb Strait
  cape_route: chokepoint7      # Cape of Good Hope

# PortWatch revises recent days after publication. Each update re-fetches this many days
# before the last stored date; the clean step keeps the most recently fetched value per day.
revision_days: 14
