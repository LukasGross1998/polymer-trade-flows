# Inputs of the transport LP (phase 2) and the route variants. Spec 015: every fact has a
# source, url and read date; facts without a source are left out. Settings are marked as such.
# Value register: docs/value_register.md.

# setting: the LP runs only when all inputs below are sourced (freight, and capacity,
# utilisation and production cost of every region). Today they are not: the LP stays off and
# `ptf model` only writes the sea distances.
enabled: false

base_year: 2023      # setting: year of the observed flows the LP is compared with
penalty_usd_t: 5000  # setting: technical cost of one tonne of unmet demand, far above any supply cost

# Route variants: extra sea-distance tables with passages blocked (searoute names), written
# by `ptf ingest` as data/raw/distances/sea_distances_<name>.parquet. Settings: scenarios to
# look at, used by the landed-cost and planner views.
route_variants:
  babalmandab_closed:
    note: >-
      Bab el-Mandeb closed: cargo from Asia and the Gulf goes around the Cape; the Red Sea
      stays reachable from the north through Suez. Panama is blocked as well: otherwise
      searoute routes Asian cargo to Europe through Panama instead of around the Cape.
    restrictions: [northwest, babalmandab, panama]
  suez_closed:
    note: Suez closed, otherwise as above.
    restrictions: [northwest, suez, panama]
  malacca_closed:
    note: >-
      Malacca closed: Asian cargo goes through the Sunda Strait. Northwest Passage and Panama
      blocked so that searoute does not send it through the Arctic or across the Pacific.
    restrictions: [northwest, malacca, panama]
  gibraltar_closed:
    note: >-
      Gibraltar closed: cargo from Asia and the Gulf goes around the Cape. Northwest Passage
      and Panama blocked as above.
    restrictions: [northwest, gibraltar, panama]
# `ptf ingest` also writes every combination of variants (e.g. malacca_closed+red_sea_closed).

# Countries that do not ship from their region's representative port (spec 014). Each entry
# needs a source showing that the country's polyethylene is made at / leaves from the port;
# port coordinates are a setting (a point in the port; searoute snaps it to the sea lane).
# Several ports without sourced shares: the views show a range, never a split.
country_routes:
  EGY:
    ports: [{name: Alexandria, lon: 29.87, lat: 31.19}]
    source: "Oil & Gas Journal: Sidi Kerir Petrochemicals (SIDPEC), Egypt's largest PE producer, polyethylene at its Alexandria complex"
    url: "https://www.ogj.com/refining-processing/petrochemicals/article/14197489/egypts-sidpec-advances-expansion-of-alexandria-petrochemicals-complex"
    read: 2026-11-14
  ISR:
    ports: [{name: Haifa, lon: 35.01, lat: 32.83}]
    source: "Global Energy Monitor: Carmel Olefins (BAZAN Group), polyethylene plant at Haifa Bay"
    url: "https://www.gem.wiki/Carmel_Olefins_Haifa_Chemical_Plant"
    read: 2026-11-14
  SAU:
    ports:
      - {name: Al Jubail, lon: 49.70, lat: 27.05}
      - {name: Yanbu, lon: 38.05, lat: 24.05}
    source: "SABIC manufacturing affiliates: polyethylene at Kemya and Sharq (Al Jubail) and at Yansab and Yanpet (Yanbu); shares per port not published"
    url: "https://www.sabic.com/en/about/locations/sabic-manufacturing-affiliates"
    read: 2026-11-14

# Sea freight: no source gives a rate per tonne for all routes (spec 015, research of
# 14 Nov 2026): the Drewry WCI covers only lanes from Shanghai, its terms do not allow
# redistribution, and the tonnes per container are not documented. Left out until a free
# freight source is added (phase 5).
# freight:
#   fixed_usd_t: {value: …, source: …, url: …, read: …}
#   variable_usd_t_per_1000nm: {value: …, source: …, url: …, read: …}

# Per region: installed PE capacity (Mt/yr). Utilisation and production cost have no source
# (McKinsey gives only the levelized cost of a new plant, not the cash cost of existing ones).
regions:
  NAM:
    capacity_mt:
      value: 34
      source: "McKinsey Global Institute, 'Polyethylene: Widely produced - but not one-size-fits-all', installed capacity 2025, North America (data: S&P Global Market Intelligence)"
      url: "https://www.mckinsey.com/mgi/our-research/polyethylene-widely-produced-but-not-one-size-fits-all"
      read: 2026-11-14
  SAM: {}
  EUR:
    capacity_mt:
      value: 14
      source: "McKinsey Global Institute, 'Polyethylene: Widely produced - but not one-size-fits-all', installed capacity 2025, Western Europe (data: S&P Global Market Intelligence)"
      url: "https://www.mckinsey.com/mgi/our-research/polyethylene-widely-produced-but-not-one-size-fits-all"
      read: 2026-11-14
      note: "Western Europe only; the model region also covers Central Europe and Turkey"
  CIS: {}
  MDE:
    capacity_mt:
