# Inputs of the transport LP (phase 2) and the route variants. Spec 015: every fact has a
# source, url and read date; facts without a source are left out. Settings are marked as such.
# Value register: docs/value_register.md.

# setting: the LP runs only when all inputs below are sourced (freight, and capacity,
# utilisation and production cost of every region). Today they are not: the LP stays off and
# `ptf model` only writes the sea distances.
enabled: false

base_year: 2023      # setting: year of the observed flows the LP is compared with
penalty_usd_t: 5000  # setting: technical cost of one tonne of unmet demand, far above any supply cost

# Route variants: extra sea-distance tables with passages blocked (searoute names), written
# by `ptf ingest` as data/raw/distances/sea_distances_<name>.parquet. Settings: scenarios to
# look at, used by the landed-cost and planner views.
route_variants:
  red_sea_closed:
    note: >-
      Suez and Bab el-Mandeb closed. Panama is blocked as well: otherwise searoute routes
      Asian cargo to Europe through Panama instead of around the Cape of Good Hope.
    restrictions: [northwest, suez, babalmandab, panama]

# Sea freight: no source gives a rate per tonne for all routes (spec 015, research of
# 14 Nov 2026): the Drewry WCI covers only lanes from Shanghai, its terms do not allow
# redistribution, and the tonnes per container are not documented. Left out until a free
# freight source is added (phase 5).
# freight:
#   fixed_usd_t: {value: …, source: …, url: …, read: …}
#   variable_usd_t_per_1000nm: {value: …, source: …, url: …, read: …}

# Per region: installed PE capacity (Mt/yr). Utilisation and production cost have no source
# (McKinsey gives only the levelized cost of a new plant, not the cash cost of existing ones).
regions:
  NAM:
    capacity_mt:
      value: 34
      source: "McKinsey Global Institute, 'Polyethylene: Widely produced - but not one-size-fits-all', installed capacity 2025, North America (data: S&P Global Market Intelligence)"
      url: "https://www.mckinsey.com/mgi/our-research/polyethylene-widely-produced-but-not-one-size-fits-all"
      read: 2026-11-14
  SAM: {}
  EUR:
    capacity_mt:
      value: 14
      source: "McKinsey Global Institute, 'Polyethylene: Widely produced - but not one-size-fits-all', installed capacity 2025, Western Europe (data: S&P Global Market Intelligence)"
      url: "https://www.mckinsey.com/mgi/our-research/polyethylene-widely-produced-but-not-one-size-fits-all"
      read: 2026-11-14
      note: "Western Europe only; the model region also covers Central Europe and Turkey"
  CIS: {}
  MDE:
    capacity_mt:
      value: 23
      source: "McKinsey Global Institute, 'Polyethylene: Widely produced - but not one-size-fits-all', installed capacity 2025, Middle East (data: S&P Global Market Intelligence)"
      url: "https://www.mckinsey.com/mgi/our-research/polyethylene-widely-produced-but-not-one-size-fits-all"
      read: 2026-11-14
  AFR: {}
  IND: {}
  CHN:
    capacity_mt:
      value: 42
      source: "McKinsey Global Institute, 'Polyethylene: Widely produced - but not one-size-fits-all', installed capacity 2025, China (data: S&P Global Market Intelligence)"
      url: "https://www.mckinsey.com/mgi/our-research/polyethylene-widely-produced-but-not-one-size-fits-all"
      read: 2026-11-14
  NEA: {}
  SEA: {}
