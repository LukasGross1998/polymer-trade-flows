# Mapping of countries (ISO 3166-1 alpha-3) to model regions.
#
# setting: own grouping into 10 regions with similar supply economics and
# shipping geography. Rationale per region: docs/methodology.md, section "Regions".
#
# Per region:
# - `reporters`: the ~30 largest polyethylene traders. Only these are queried from Comtrade.
# - `members`:   all other countries of the region. They are not queried, but their trade is
#                visible through the reporters' reports and must be counted in the right
#                region (otherwise e.g. Germany -> Spain would look like trade with "rest of
#                world" instead of trade within Europe).
# Countries listed nowhere (mainly Oceania) fall into the rest-of-world region.
#
# `port` (setting) is the representative seaport used for sea distances (searoute). Coordinates are
# approximate (lon, lat in decimal degrees); searoute snaps them to the nearest sea lane.

rest_of_world: ROW

# Comtrade codes that are not ISO codes but stand for a known country.
comtrade_aliases:
  S19: TWN  # "Other Asia, nes" is Comtrade's convention for Taiwan (Taiwan does not report)

regions:
  NAM:
    name: North and Central America
    port: {name: Houston, lon: -95.0, lat: 29.7}
    reporters: [USA, CAN, MEX]
    # Central America and the Caribbean are supplied mainly from the US Gulf Coast.
    members: [GTM, BLZ, SLV, HND, NIC, CRI, PAN, CUB, DOM, HTI, JAM, TTO, BHS, BRB, PRI]
  SAM:
    name: South America
    port: {name: Santos, lon: -46.3, lat: -24.0}
    reporters: [BRA, ARG, CHL]
    members: [COL, PER, ECU, VEN, BOL, PRY, URY, GUY, SUR]
  EUR:
    name: Europe
    port: {name: Rotterdam, lon: 4.05, lat: 51.95}
    reporters: [DEU, BEL, NLD, FRA, ITA, GBR, POL, TUR]
    # Rest of the EU, EFTA, Western Balkans, Ukraine and Moldova
    members: [AUT, BGR, HRV, CYP, CZE, DNK, EST, FIN, GRC, HUN, IRL, LVA, LTU, LUX, MLT,
              PRT, ROU, SVK, SVN, ESP, SWE, CHE, NOR, ISL, SRB, BIH, MNE, MKD, ALB, UKR, MDA]
  CIS:
    name: Russia and CIS
    port: {name: St. Petersburg, lon: 30.2, lat: 59.9}
    reporters: [RUS]
    members: [BLR, KAZ, UZB, TKM, KGZ, TJK, ARM, AZE, GEO]
  MDE:
    name: Middle East
    port: {name: Jebel Ali, lon: 55.0, lat: 25.0}
    reporters: [SAU, ARE, QAT, IRN]
    members: [KWT, OMN, BHR, IRQ, ISR, JOR, LBN, SYR, YEM, PSE]
  AFR:
    name: Africa
    port: {name: Durban, lon: 31.05, lat: -29.9}
    reporters: [EGY, ZAF]
    members: [DZA, AGO, BEN, BWA, BFA, BDI, CPV, CMR, CAF, TCD, COM, COG, COD, CIV, DJI, GNQ,
              ERI, SWZ, ETH, GAB, GMB, GHA, GIN, GNB, KEN, LSO, LBR, LBY, MDG, MWI, MLI, MRT,
              MUS, MAR, MOZ, NAM, NER, NGA, RWA, STP, SEN, SYC, SLE, SOM, SSD, SDN, TZA, TGO,
              TUN, UGA, ZMB, ZWE]
  IND:
    name: India and South Asia
    port: {name: Nhava Sheva, lon: 72.95, lat: 18.95}
    reporters: [IND]
    members: [PAK, BGD, LKA, NPL, BTN, MDV, AFG]
  CHN:
    name: China
    port: {name: Shanghai, lon: 121.8, lat: 31.2}
    reporters: [CHN, HKG]
    members: [MAC]
  NEA:
    name: Northeast Asia (excl. China)
    port: {name: Busan, lon: 129.05, lat: 35.1}
    reporters: [JPN, KOR, TWN]
    members: [PRK, MNG]
  SEA:
    name: Southeast Asia
    port: {name: Singapore, lon: 103.85, lat: 1.25}
    reporters: [SGP, THA, MYS, VNM, IDN]
    members: [PHL, MMR, KHM, LAO, BRN, TLS]
