[project]
name = "polymer-trade-flows"
version = "0.5.0"
description = "Polymer Trade Flow & Disruption Simulator: global polyethylene trade, transport LP and disruption scenarios."
readme = "README.md"
authors = [{ name = "LukasGross1998" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "dash>=4.5.0",
    "dbt-core>=1.12,<1.13",
    "dbt-duckdb>=1.11,<1.12",
    "duckdb>=2.0.0",
    "gunicorn>=27.0.1",
    "highspy>=1.16.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "pydantic-settings>=2.16.2",
    "pyomo>=6.10.1",
    "python-calamine>=0.9.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "searoute>=1.6.0",
]

[project.scripts]
ptf = "ptf.cli:main"

[project.optional-dependencies]
asia = [
    "akshare==1.20.42",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ptf"

[dependency-groups]
dev = [
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261111",
    "types-requests>=2.33.0.20261030",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes (unused imports, undefined names), I: import sorting,
# UP: modern Python syntax, B: likely bugs, SIM: simplifications
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "-p no:dash": Dash ships a pytest plugin for browser tests that we do not use.
addopts = "-ra -p no:dash"
# Deselect with `-m "not slow"` for a quick local loop; CI runs everything.
# DuckDB's own DataFrame conversion triggers this pandas 3.1 deprecation, not our code.
filterwarnings = ["ignore:The inplace keyword in DataFrame.drop is deprecated"]
markers = ["slow: computes real sea routes or other expensive work (seconds, not ms)"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
# pandas methods often return Any in the stubs; flagging every such return adds noise
# without finding bugs (ADR-010). Everything else of --strict stays on.
warn_return_any = false
# Libraries without type information: treat their objects as Any instead of failing.
[[tool.mypy.overrides]]
module = ["pyomo.*", "searoute.*", "plotly.*", "highspy.*", "akshare.*"]
ignore_missing_imports = true

# Dependency rules between the packages (ADR-012), checked with `uv run lint-imports`.
[tool.importlinter]
root_package = "ptf"

[[tool.importlinter.contracts]]
name = "Entry points on top, insights, independent domains, core at the bottom"
type = "layers"
# A higher layer may import a lower one, never the other way round. Modules separated by
# "|" are independent: they must not import each other (domains talk via the warehouse).
# `insights` combines domains for the buyer view (ADR-014).
layers = [
    "ptf.cli | ptf.app",
    "ptf.insights",
    "ptf.trade | ptf.shipping | ptf.markets | ptf.model | ptf.legacy",
    "ptf.core",
]

[[tool.importlinter.contracts]]
name = "Only the command line uses the superseded Comtrade code"
type = "forbidden"
source_modules = ["ptf.app", "ptf.insights"]
forbidden_modules = ["ptf.legacy"]
