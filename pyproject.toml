[project]
name = "polymer-trade-flows"
version = "0.1.0"
description = "Polymer Trade Flow & Disruption Simulator: global polyethylene trade, transport LP and disruption scenarios."
readme = "README.md"
authors = [{ name = "LukasGross1998" }]
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ptf"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes (unused imports, undefined names), I: import sorting,
# UP: modern Python syntax, B: likely bugs, SIM: simplifications
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
